<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montreal olfaction - Un événement dédié au parfum eT à l’expérience olfactive du 28 au 30 septembre</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&family=Xanh+Mono:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/style/base.css">
    <link rel="stylesheet" href="./assets/style/background.css">
    <link rel="stylesheet" href="./assets/style/splash.css">
</head>
<body>
    <div class="background">
        <svg class="background__noise" xmlns='http://www.w3.org/2000/svg'>
            <filter id='noiseFilter'>
                <feTurbulence 
                id="noise"
                type='fractalNoise' 
                seed='1'
                baseFrequency='0.65' 
                numOctaves='1' 
                stitchTiles='stitch' />
            </filter>

            <rect width='100%' height='100%' filter='url(#noiseFilter)'>
            </rect>
        </svg>
        <div class="background__circle-green"></div>
        <div class="background__circle-big-orange"></div>
        <section class="splash">
            <div class="splash__intro">La première édition</div>
            <h1 class="splash__title visually-hidden">Mtl Olfaction</h1>
            <img class="splash__logo" src="./assets/img/mtlolfaction-logo.svg" alt="">
            <div class="splash__subtext splash__subtext--1">Un événement dédié au parfum</div>
            <div class="splash__subtexts">
                <div class="splash__subtext splash__subtext--2">ET à l’expérience olfactive</div>
                <div class="splash__subtext splash__subtext--date">Du 28 au 30 septembre</div>
            </div>
        </section>
    </div>
    <script type="text/javascript" src="./assets/script/script.js"></script>
</body>
</html>
