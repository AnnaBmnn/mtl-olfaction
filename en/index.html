<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montreal Olfaction — An event dedicated to perfume and the olfactory experience, August 28–30, 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mona+Sans:ital,wght@0,200..900;1,200..900&family=Xanh+Mono:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/style/base.css">
    <link rel="stylesheet" href="../assets/style/background.css">
    <link rel="stylesheet" href="../assets/style/splash.css">
</head>
<body>
    <nav class="lang-switcher">
        <a class="lang-switcher__link" href="../index.html">FR</a>
    </nav>
    <div class="background">
        <svg class="background__noise" xmlns='http://www.w3.org/2000/svg'>
            <filter id='noiseFilter'>
                <feTurbulence
                id="noise"
                type='fractalNoise'
                seed='1'
                baseFrequency='0.65'
                numOctaves='1'
                stitchTiles='stitch' />
            </filter>

            <rect width='100%' height='100%' filter='url(#noiseFilter)'>
            </rect>
        </svg>
        <div class="background__circle-green"></div>
        <div class="background__circle-big-orange"></div>
        <section class="splash">
            <div class="splash__intro">The first edition</div>
            <h1 class="splash__title visually-hidden">Mtl Olfaction</h1>
            <img class="splash__logo" src="../assets/img/mtlolfaction-logo.svg" alt="">
            <div class="splash__subtext splash__subtext--1">An event dedicated to perfume</div>
            <div class="splash__subtexts">
                <div class="splash__subtext splash__subtext--2">AND to the olfactory experience</div>
                <div class="splash__subtext splash__subtext--date">August 28 to 30, 2026</div>
            </div>
        </section>
    </div>
    <script type="text/javascript" src="../assets/script/script.js"></script>
</body>
</html>
